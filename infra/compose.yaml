services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-labcrm.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labcrm"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ../backend
    restart: unless-stopped
    env_file:
      - .env.app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import os, urllib.request;
          host = [h.strip() for h in os.getenv('ALLOWED_HOSTS', 'localhost').split(',') if h.strip()][0];
          req = urllib.request.Request(
              'http://127.0.0.1:8000/healthz/',
              headers={'Host': host, 'X-Forwarded-Proto': 'https'}
          );
          urllib.request.urlopen(req, timeout=5)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  scheduler:
    build: ../backend
    restart: unless-stopped
    env_file:
      - .env.app
    command: ["python", "manage.py", "scheduler"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
