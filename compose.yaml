services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: labcrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      LAB_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-labcrm.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labcrm"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "scheduler"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
